<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detection</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="/static/mywebscript.js" defer></script>
    <style>
        body { background: #f5f7fb; }
        .app-card { max-width: 860px; margin: 7vh auto; }
        .result { min-height: 5rem; white-space: pre-wrap; }
    </style>
</head>
<body>
    <main class="container">
        <section class="card shadow-sm app-card">
            <div class="card-body p-4 p-md-5">
                <h1 class="text-center mb-4">NLP — Emotion Detection</h1>
                <label for="textToAnalyze" class="form-label">
                    Please enter the text to be analyzed
                </label>
                <textarea id="textToAnalyze" class="form-control" rows="4"
                          placeholder="Type customer feedback here"></textarea>
                <button id="analyzeButton" class="btn btn-primary mt-3" type="button">
                    Run Emotion Detection
                </button>
                <h2 class="h5 mt-4">Result of Emotion Detection</h2>
                <div id="system_response" class="result border rounded bg-light p-3"
                     role="status" aria-live="polite"></div>
            </div>
        </section>
    </main>
</body>
</html>
